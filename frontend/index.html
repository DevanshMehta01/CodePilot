<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CodePilot<></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="topbar">
        <a class="brand" href="index.html">
            <span class="brand-mark">cp</span>
            <span class="brand-name">CodePilot<></span>
        </a>
        <span class="topbar-meta">codebase Q&amp;A</span>
    </div>

    <main class="page page-narrow">
        <h1>Projects</h1>
        <p class="page-subtitle">Upload a codebase, index it, and ask questions about how it works.</p>

        <div id="error-box" class="alert" role="alert"></div>

        <section>
            <p class="section-label">New project</p>
            <form id="create-project-form">
                <div class="field">
                    <label for="project-name">Name</label>
                    <input type="text" id="project-name" placeholder="inventory-service" required>
                </div>
                <div class="field">
                    <label for="project-description">Description</label>
                    <textarea id="project-description" placeholder="What this codebase does (optional)"></textarea>
                </div>
                <button type="submit" class="btn-primary">Create project</button>
            </form>
        </section>

        <section>
            <p class="section-label">All projects</p>
            <div id="project-list">
                <div class="empty-state">Loading projects&hellip;</div>
            </div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
