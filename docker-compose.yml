services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codepilot-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - codepilot-data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  codepilot-data: